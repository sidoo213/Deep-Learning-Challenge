# @package _global_
# TSM — Track A (from scratch). Optimized for a small Something-Something subset.
defaults:
  - override /model: tsm

dataset:
  num_frames: 4          # must match model.num_segments — pinned at 4 project-wide

training:
  epochs: 40            # from-scratch needs far more than 10; TSM recipe uses 40-50
  batch_size: 32        # 32 * 4 = 128 frames/step; reduce to 16 if VRAM-limited
  # AdamW @ 1e-3 is the ablation-winning recipe (beats SGD @ 1e-2 on top-1).
  lr: 1.0e-3
  optimizer: adamw
  weight_decay: 0.0005
  momentum: 0.9         # ignored by AdamW; kept for optimizer=sgd overrides

  # Cosine LR decay with a short warmup over the run.
  scheduler: cosine
  warmup_epochs: 3
  min_lr_ratio: 0.0

  use_amp: true

  # Augmentation — CRITICAL for Something-Something
  use_horizontal_flip: false    # MUST be off — SS has directional classes
  use_random_crop: true
  random_crop_scale: [0.6, 1.0]
  use_color_jitter: true
  color_jitter_strength: 0.2

  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
