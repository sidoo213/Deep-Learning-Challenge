[project]
name = "challenge"
version = "0.1.0"
description = "Video frame classification (PyTorch + Hydra). Training code lives in project/."
readme = false
requires-python = ">=3.10"
dependencies = [
    # Versions aligned with wheels on the PyTorch cu128 index (Linux/Windows).
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pillow>=10.0.0",
    # Track B (open world): HuggingFace transformers for pretrained video models
    # (VideoMAE, TimeSformer). Lazy-imported in src/train.py, so Track A code
    # never touches it at runtime — but installed unconditionally for simplicity.
    "transformers>=4.40.0",
    # LoRA / PEFT for parameter-efficient fine-tuning of V-JEPA 2 (and other
    # Track B backbones). Lazy-imported in models/b_vjepa2.py, only when
    # `model.use_lora=true` — Track A users pay zero cost.
    "peft>=0.10.0",
    # timm: model registry used by coatnet_temporal (and any other timm-
    # backed wrapper). Lazy-imported in models/coatnet_temporal.py, so
    # the rest of the project keeps working if timm is absent.
    "timm>=1.0.0",
    # Weights & Biases: experiment tracking / live training curves. Only
    # imported in src/train.py when `wandb.enabled=true`, so it's a no-op
    # otherwise.
    "wandb>=0.16.0",
]

[tool.uv]
package = false

# CUDA 12.8 builds: https://download.pytorch.org/whl/cu128
# explicit = true keeps non-PyTorch deps on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Use cu128 wheels on Linux and Windows. PyTorch does not ship CUDA wheels for macOS;
# those platforms fall back to PyPI (CPU) automatically.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
